name: Customer instance frontend
on:
  push:
    branches: [codex/customer-instances]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Verify instance paths and compile production UI
        run: |
          npm ci --no-audit --no-fund
          node --experimental-strip-types --input-type=module -e "import {isKovaInstancePath as valid} from './src/app/core/instance-path.ts'; import assert from 'node:assert/strict'; assert(valid('/tasktracker-prueba/')); assert(valid('/apps/tasktracker/tt-'+ 'a'.repeat(32) +'/')); for(const p of ['/', '/apps/tasktracker/tt-../', '/tasktracker-prueba/extra', '/apps/tasktracker/tt-'+ 'A'.repeat(32) +'/']) assert(!valid(p));"
          npm run build -- --base-href /tasktracker-prueba/
