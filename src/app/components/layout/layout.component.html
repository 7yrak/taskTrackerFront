<div class="app-shell">
  <header class="app-topbar">
    <a class="brand-link" routerLink="/dashboard" aria-label="TaskTracker">
      <app-logo [size]="34" [showText]="true" [onDark]="theme.isDark()" />
    </a>

    <nav class="top-nav" aria-label="Navegación principal">
      @for (item of navItems; track item.route) {
        <a mat-button
           [routerLink]="item.route"
           class="nav-link"
           routerLinkActive="active-link"
           [routerLinkActiveOptions]="{ exact: false }">
          <mat-icon>{{ item.icon }}</mat-icon>
          <span>{{ item.label }}</span>
        </a>
      }
    </nav>

    <div class="topbar-actions">
      <button mat-icon-button
              class="theme-toggle"
              type="button"
              (click)="theme.toggle()"
              [attr.aria-label]="theme.isDark() ? 'Cambiar a modo claro' : 'Cambiar a modo oscuro'"
              [matTooltip]="theme.isDark() ? 'Modo claro' : 'Modo oscuro'">
        <mat-icon>{{ theme.isDark() ? 'light_mode' : 'dark_mode' }}</mat-icon>
      </button>
      <button type="button" class="user-chip" [matMenuTriggerFor]="userMenu" aria-label="Menú de usuario">
        <span class="avatar" aria-hidden="true">{{ initial }}</span>
        <span class="user-name">{{ auth.account()?.username }}</span>
        <mat-icon aria-hidden="true">expand_more</mat-icon>
      </button>
      <mat-menu #userMenu="matMenu" xPosition="before">
        <button mat-menu-item type="button" (click)="logout()">
          <mat-icon>logout</mat-icon>
          <span>Cerrar sesión</span>
        </button>
      </mat-menu>
    </div>
  </header>

  <main class="content-area" [class.tasks-route]="isTasksRoute()" [class.overtime-route]="isOvertimeRoute()">
    <router-outlet />
  </main>
</div>
